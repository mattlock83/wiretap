openapi: 3.0.0
info:
  title: Example SUT
  version: 1.0.0
paths:
  /process:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action]
              properties:
                id:
                  type: string
                action:
                  type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [message, downstream]
                properties:
                  message:
                    type: string
                  downstream:
                    type: array
                    items:
                      type: object
                      required: [path, status, body]
                      properties:
                        path:
                          type: string
                        status:
                          type: integer
                        body:
                          type: string
  /healthz:
    get:
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema:
                type: string
  /status:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
