openapi: 3.0.0
info:
  title: Example SUT
  version: 1.0.0
paths:
  /process:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action]
              properties:
                id:
                  type: string
                action:
                  type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [message, id, action]
                properties:
                  message:
                    type: string
                  id:
                    type: string
                  action:
                    type: string
        "400":
          description: invalid request body or missing required strings
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /healthz:
    get:
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema:
                type: string
  /status:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /large:
    get:
      responses:
        "200":
          description: body larger than the example capture limit
          content:
            text/plain:
              schema:
                type: string
