openapi: 3.0.3
info: {title: Orders provider, version: '1'}
paths:
  /orders:
    post:
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, quantity]
              properties:
                user_id: {type: string, minLength: 1}
                quantity: {type: integer, minimum: 1, maximum: 3}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, required: [id], properties: {id: {type: string}}}
        '400':
          description: Invalid request
          content:
            application/json:
              schema: {type: object, required: [error], properties: {error: {type: string}}}
        '401': {description: Authentication required}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
