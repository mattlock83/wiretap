openapi: 3.0.0
info:
  title: Transaction Service
  version: 1.0.0
paths:
  /transactions:
    get:
      parameters:
        - in: query
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: transaction list
          content:
            application/json:
              schema:
                type: object
                required: [account, transactions]
                properties:
                  account:
                    type: object
                    required: [id, name, balance, currency, status]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      balance:
                        type: number
                      currency:
                        type: string
                      status:
                        type: string
                  transactions:
                    type: array
                    items:
                      type: object
                      required:
                        - transaction_id
                        - direction
                        - account_id
                        - counterparty_account
                        - amount
                        - currency
                        - created_at
                      properties:
                        transaction_id:
                          type: string
                        direction:
                          type: string
                        account_id:
                          type: string
                        counterparty_account:
                          type: string
                        amount:
                          type: number
                        currency:
                          type: string
                        created_at:
                          type: string
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_account, to_account, amount]
              properties:
                from_account:
                  type: string
                to_account:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
      responses:
        "201":
          description: transaction recorded
          content:
            application/json:
              schema:
                type: object
                required: [transaction_id, status]
                properties:
                  transaction_id:
                    type: string
                  status:
                    type: string
  /healthz:
    get:
      responses:
        "200":
          description: healthy
          content:
            text/plain:
              schema:
                type: string
