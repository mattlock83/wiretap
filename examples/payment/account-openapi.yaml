openapi: 3.0.0
info:
  title: Account Service (Fake)
  version: 1.0.0
paths:
  /accounts/{account_id}:
    get:
      parameters:
        - in: path
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: account details
          content:
            application/json:
              schema:
                type: object
                required: [id, name, balance, currency, status]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  balance:
                    type: number
                  currency:
                    type: string
                  status:
                    type: string
