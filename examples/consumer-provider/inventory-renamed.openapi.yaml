openapi: 3.0.3
info: {title: Inventory example with a renamed field, version: '2.0'}
paths:
  /stock/widget-1:
    get:
      operationId: getStock
      responses:
        '200':
          description: Available inventory
          content:
            application/json:
              schema:
                type: object
                required: [availableQuantity]
                additionalProperties: false
                properties:
                  availableQuantity: {type: integer, minimum: 0}
