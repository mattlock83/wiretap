syntax = "proto3";
package wiretap.example.orders.v1;

import "buf/validate/validate.proto";

service Orders {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc WatchOrders(CreateOrderRequest) returns (stream Order);
  rpc CreateOrders(stream CreateOrderRequest) returns (Order);
  rpc ChatOrders(stream CreateOrderRequest) returns (stream Order);
}

message CreateOrderRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string sku = 2 [(buf.validate.field).string = {min_len: 3, max_len: 12}];
  int32 quantity = 3 [(buf.validate.field).int32 = {gte: 1, lte: 5}];
}

message Order {
  string id = 1;
  string sku = 2;
  int32 quantity = 3;
}
