openapi: 3.0.3
info: {title: Python items API, version: '1.0'}
paths:
  /items/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: An item
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: {type: integer}
                  name: {type: string}
        '400':
          description: Invalid identifier
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
