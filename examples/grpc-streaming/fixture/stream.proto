syntax = "proto3";
package wiretap.example.v1;

// One small service deliberately includes all four native gRPC shapes.
service Streams {
  rpc Echo(Message) returns (Message);
  rpc Watch(Message) returns (stream Message);
  rpc Collect(stream Message) returns (Message);
  rpc Chat(stream Message) returns (stream Message);
}
message Message {
  string value = 1;
  int32 count = 2;
  bytes data = 3;
}
