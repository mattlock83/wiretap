openapi: 3.0.3
info: {title: Example Orders, version: '1'}
paths:
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: integer, minimum: 1}
                  status: {type: string, enum: [pending, complete]}
        '400':
          description: Invalid order ID
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string, enum: [invalid_order_id]}
