openapi: 3.0.3
info:
  title: Inventory Service API
  version: 1.0.0
paths:
  /inventory/products/{productId}:
    get:
      operationId: getInventoryProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: quantity
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: product inventory
          content:
            application/json:
              schema:
                type: object
                required: [productId, available, quantity]
                properties:
                  productId:
                    type: string
                  available:
                    type: boolean
                  quantity:
                    type: integer
                  warehouse:
                    type: string
