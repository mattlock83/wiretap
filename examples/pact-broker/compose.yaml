services:
  pact-broker:
    image: ${PACT_BROKER_IMAGE:-pactfoundation/pact-broker:latest}
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: /tmp/phrond-pact-broker.sqlite3
      PACT_BROKER_LOG_LEVEL: WARN
      PACT_BROKER_SQL_LOG_LEVEL: none
    ports:
      - "127.0.0.1:${PACT_BROKER_PORT:-9292}:9292"
