openapi: 3.0.3
info:
  title: Accounts dependency assumptions for the withdrawal example
  version: 1.0.0
  description: >-
    The HTTP mock implements these three operations consumed by Transactions.
    This is a consumer contract subset, not the entire upstream Accounts API.
paths:
  /api/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      responses:
        '200':
          description: Account owned by the current test user
          content:
            application/json:
              schema:
                type: object
                required: [id, userId, accountNumber, accountType, balance]
                properties:
                  id: {type: integer, format: int64}
                  userId: {type: integer, format: int64}
                  accountNumber: {type: string}
                  accountType: {type: string, enum: [CHECKING, SAVINGS]}
                  balance: {type: number}
  /api/accounts/{accountId}/balance:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      responses:
        '200':
          description: Current account balance
          content:
            application/json:
              schema:
                type: object
                required: [balance, accountNumber]
                properties:
                  balance: {type: number}
                  accountNumber: {type: string}
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [balance]
              properties:
                balance: {type: number}
      responses:
        '200':
          description: Balance updated, empty body
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: {type: integer, format: int64}
