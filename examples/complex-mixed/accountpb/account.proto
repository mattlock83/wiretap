syntax = "proto3";

package account;

service AccountService {
  rpc GetAccount (AccountRequest) returns (AccountReply);
}

message AccountRequest {
  string account_id = 1;
}

message AccountReply {
  string id = 1;
  string name = 2;
  double balance = 3;
  string currency = 4;
  string status = 5;
}
