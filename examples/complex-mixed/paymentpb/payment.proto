syntax = "proto3";

package payment;

service PaymentService {
  rpc Submit (PaymentSubmitRequest) returns (PaymentSubmitReply);
}

message PaymentSubmitRequest {
  string from_account = 1;
  string to_account = 2;
  double amount = 3;
  string currency = 4;
}

message PaymentSubmitReply {
  string payment_id = 1;
  string status = 2;
  string error_code = 3;
  string message = 4;
  string transaction_id = 5;
  string from_account_name = 6;
  string to_account_name = 7;
  double remaining_balance = 8;
}
