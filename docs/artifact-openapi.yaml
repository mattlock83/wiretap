openapi: 3.1.0
info:
  title: Test Artifact Schema
  version: 1.0.0
  description: Schema for YAML artifacts produced by the recorder.
paths:
  /artifact:
    get:
      summary: Artifact document
      description: Returns a single artifact document. This is a schema anchor for validation.
      responses:
        "200":
          description: Artifact
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Artifact"
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
components:
  schemas:
    Artifact:
      type: object
      required:
        - version
        - testcase
        - traffic
      properties:
        version:
          type: integer
          minimum: 1
        capture_incomplete:
          type: boolean
          description: Capture drain timed out or was cancelled; the test is failed.
        capture_diagnostics:
          type: array
          items: {type: string}
        producer:
          $ref: "#/components/schemas/Producer"
        testcase:
          $ref: "#/components/schemas/TestCase"
        environment:
          $ref: "#/components/schemas/Environment"
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaRef"
        traffic:
          type: array
          items:
            $ref: "#/components/schemas/Flow"
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
        schema_validation:
          $ref: "#/components/schemas/SchemaValidation"
        redactions:
          type: array
          items:
            $ref: "#/components/schemas/Redaction"
        meta:
          type: object
          additionalProperties: true
      additionalProperties: false

    Producer:
      type: object
      description: >-
        Auto-detected identity of the repository and build that produced this
        artifact. Used by a central broker as the consumer-side join key.
      properties:
        repo:
          type: string
        commit_sha:
          type: string
        branch:
          type: string
        build:
          type: string
        source:
          type: string
          description: How identity was resolved (env, github-actions, gitlab-ci, git).
      additionalProperties: false

    TestCase:
      type: object
      required:
        - id
        - name
        - started_at
      properties:
        id:
          type: string
        name:
          type: string
        trace_id:
          type: string
          description: W3C trace ID of this test attempt.
        root_span_id:
          type: string
          description: Registered test root span ID.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pass, fail, error, skip]
        tags:
          type: array
          items:
            type: string
        meta:
          type: object
          additionalProperties: true
      additionalProperties: false

    Environment:
      type: object
      properties:
        sut_base_url:
          type: string
        proxy_listen:
          type: string
        proxy_mode:
          type: string
          enum: [mitm, passthrough]
      additionalProperties: false

    SchemaRef:
      type: object
      required:
        - id
        - role
        - type
        - source
      properties:
        id:
          type: string
        role:
          type: string
          enum: [sut, dependency]
        type:
          type: string
          enum: [openapi]
        source:
          $ref: "#/components/schemas/SchemaSource"
        openapi_version:
          type: string
        asset_id:
          type: string
          description: Stable identity of the provided or externally owned dependency API.
        asset_name:
          type: string
        asset_sha:
          type: string
          description: Content fingerprint of the API schema version.
      additionalProperties: false

    SchemaSource:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [file, inline, url]
        path:
          type: string
        url:
          type: string
        content:
          type: string
        sha256:
          type: string
        format:
          type: string
        import_paths:
          type: array
          items:
            type: string
      additionalProperties: false

    Flow:
      type: object
      required:
        - id
        - protocol
        - channel
        - request
        - response
      properties:
        id:
          type: string
        protocol:
          type: string
          enum: [http]
        channel:
          type: string
          enum: [test_to_sut, sut_to_dependency]
        started_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        request:
          $ref: "#/components/schemas/HttpRequest"
        response:
          $ref: "#/components/schemas/HttpResponse"
        assertion_ids:
          type: array
          items:
            type: string
        provider_states:
          type: array
          description: Optional Pact-compatible provider verification prerequisites.
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              params:
                type: object
                additionalProperties: true
            additionalProperties: false
        asset_id:
          type: string
          description: Declared externally owned dependency receiving this request.
        trace_id:
          type: string
          description: >-
            W3C trace ID extracted from this request. Legacy artifacts may contain
            opaque IDs; consumers must continue to accept them.
        request_span_id:
          type: string
          description: Sender span ID in the request header, not the SUT internal parent span.
        trace_context_source:
          type: string
          enum: [received, injected]
        test_correlation:
          type: string
          enum: [trace, explicit_session, active_session]
        parent_correlation:
          type: string
          enum: [trace_unique, timing, ambiguous, unmatched]
        parent_flow_id:
          type: string
          description: Inferred inbound parent; omitted when ambiguous or unmatched.
        fingerprint:
          type: string
          description: >-
            Stable hash of the interaction shape (channel, dependency asset,
            method, path, status, JSON body key/type structure) for cross-run
            dedup.
        transport_error:
          type: string
          description: >-
            Original upstream connection or TLS error when the recorded
            response is a gateway-generated 502.
      additionalProperties: false

    HttpRequest:
      type: object
      required:
        - method
        - url
      properties:
        method:
          type: string
        url:
          type: string
        headers:
          $ref: "#/components/schemas/Headers"
        trailers:
          $ref: "#/components/schemas/Headers"
        body:
          $ref: "#/components/schemas/Body"
      additionalProperties: false

    HttpResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
        headers:
          $ref: "#/components/schemas/Headers"
        trailers:
          $ref: "#/components/schemas/Headers"
        body:
          $ref: "#/components/schemas/Body"
      additionalProperties: false

    Headers:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

    Body:
      type: object
      properties:
        encoding:
          type: string
          enum: [utf8, base64, binary]
        text:
          type: string
        bytes:
          type: string
          description: Base64-encoded bytes when encoding=base64.
        truncated:
          type: boolean
          description: >-
            True when the artifact retains only a bounded prefix of the body.
            Forwarding is unaffected.
        original_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Complete observed body size before capture truncation. Present
            with truncated=true; for successfully decompressed content this
            is the decompressed size.
        content_encoding:
          type: string
          description: >-
            Original on-the-wire Content-Encoding (e.g. gzip) when the payload
            was decompressed before storage. Absent means it was not compressed.
        decoded:
          $ref: "#/components/schemas/DecodedBody"
      additionalProperties: false

    DecodedBody:
      type: object
      properties:
        encoding:
          type: string
          enum: [json, text]
        text:
          type: string
        schema_ref:
          type: string
      additionalProperties: false

    Assertion:
      type: object
      required:
        - id
        - channel
        - phase
        - operator
        - result
      properties:
        id:
          type: string
        channel:
          type: string
          enum: [test_to_sut, sut_to_dependency]
        phase:
          type: string
          enum: [request, response]
        flow_id:
          type: string
        field:
          type: string
        path_lang:
          type: string
          enum: [jsonpath, header, status]
        operator:
          type: string
        expected:
          type: [string, number, boolean, object, array, "null"]
        actual:
          type: [string, number, boolean, object, array, "null"]
        result:
          type: string
          enum: [pass, fail, error, recorded]
        message:
          type: string
      additionalProperties: false

    SchemaValidation:
      type: object
      properties:
        status:
          type: string
          enum: [pass, fail, skipped]
          description: skipped when the test case attached no schemas.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/SchemaValidationError"
      additionalProperties: false

    SchemaValidationError:
      type: object
      properties:
        flow_id:
          type: string
        channel:
          type: string
        protocol:
          type: string
        phase:
          type: string
        schema_id:
          type: string
        message:
          type: string
      additionalProperties: false

    Redaction:
      type: object
      required:
        - field
        - rule
      properties:
        field:
          type: string
        rule:
          type: string
          enum: [mask, remove]
        replacement:
          type: string
      additionalProperties: false
