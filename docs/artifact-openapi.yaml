openapi: 3.1.0
info:
  title: Test Artifact Schema
  version: 1.0.0
  description: Schema for YAML artifacts produced by the recorder.
paths:
  /artifact:
    get:
      summary: Artifact document
      description: Returns a single artifact document. This is a schema anchor for validation.
      responses:
        "200":
          description: Artifact
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/Artifact"
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
components:
  schemas:
    Artifact:
      type: object
      required:
        - version
        - testcase
        - traffic
      properties:
        version:
          type: integer
          minimum: 1
        producer:
          $ref: "#/components/schemas/Producer"
        testcase:
          $ref: "#/components/schemas/TestCase"
        environment:
          $ref: "#/components/schemas/Environment"
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaRef"
        traffic:
          type: array
          items:
            $ref: "#/components/schemas/Flow"
        assertions:
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
        schema_validation:
          $ref: "#/components/schemas/SchemaValidation"
        redactions:
          type: array
          items:
            $ref: "#/components/schemas/Redaction"
        meta:
          type: object
          additionalProperties: true
      additionalProperties: false

    Producer:
      type: object
      description: >-
        Auto-detected identity of the repository and build that produced this
        artifact. Used by a central broker as the consumer-side join key.
      properties:
        repo:
          type: string
        commit_sha:
          type: string
        branch:
          type: string
        build:
          type: string
        source:
          type: string
          description: How identity was resolved (env, github-actions, gitlab-ci, git).
      additionalProperties: false

    TestCase:
      type: object
      required:
        - id
        - name
        - started_at
      properties:
        id:
          type: string
        name:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pass, fail, error]
        tags:
          type: array
          items:
            type: string
        meta:
          type: object
          additionalProperties: true
      additionalProperties: false

    Environment:
      type: object
      properties:
        sut_base_url:
          type: string
        proxy_listen:
          type: string
        mock_base_url:
          type: string
        proxy_mode:
          type: string
          enum: [mitm, passthrough]
      additionalProperties: false

    SchemaRef:
      type: object
      required:
        - id
        - role
        - type
        - source
      properties:
        id:
          type: string
        role:
          type: string
          enum: [sut, fake]
        type:
          type: string
          enum: [openapi]
        source:
          $ref: "#/components/schemas/SchemaSource"
        openapi_version:
          type: string
        asset_name:
          type: string
          description: Human-friendly asset name; defaults to id when omitted.
        asset_id:
          type: string
          description: >-
            Stable, cross-repo identifier for the asset. A broker joins a
            consumer's faked dependency (role: fake) to the provider that owns
            the same asset_id (role: sut).
        asset_sha:
          type: string
          description: Fingerprint of the asset version; defaults to source.sha256.
      additionalProperties: false

    SchemaSource:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [file, inline, url]
        path:
          type: string
        url:
          type: string
        content:
          type: string
        sha256:
          type: string
        format:
          type: string
        import_paths:
          type: array
          items:
            type: string
      additionalProperties: false

    Flow:
      type: object
      required:
        - id
        - protocol
        - channel
        - request
        - response
      properties:
        id:
          type: string
        protocol:
          type: string
          enum: [http]
        channel:
          type: string
          enum: [test_to_sut, sut_to_mock]
        started_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        request:
          $ref: "#/components/schemas/HttpRequest"
        response:
          $ref: "#/components/schemas/HttpResponse"
        assertion_ids:
          type: array
          items:
            type: string
        matched_stub_id:
          type: string
        asset_id:
          type: string
          description: >-
            Declared dependency this sut_to_mock flow was routed to. Ground
            truth for attribution — no spec inference required.
        trace_id:
          type: string
          description: >-
            Phrond trace id. Injected by the proxy on test_to_sut requests;
            present on sut_to_mock flows when the SUT propagated the
            X-Phrond-Trace-Id header.
        parent_flow_id:
          type: string
          description: >-
            The test_to_sut flow that caused this sut_to_mock call, resolved by
            trace id when available, else by time-window nesting.
        fingerprint:
          type: string
          description: >-
            Stable hash of the interaction shape (channel, method, path,
            status, JSON body key/type structure) for cross-run dedup.
        consumed_fields:
          type: array
          items:
            type: string
          description: >-
            Response fields the test declared it depends on (via the verify
            API). Distinguishes breaking changes from changes to ignored fields.
        mock_stub:
          $ref: "#/components/schemas/MockStub"
        unmatched:
          type: boolean
          description: >-
            True when the SUT called the mock but no stub matched — an
            undeclared dependency call the tests never modelled.
      additionalProperties: false

    MockStub:
      type: object
      description: >-
        The consumer's modelled assumption that produced a sut_to_mock response:
        the match rule plus the unrendered response template (the stable
        contract, distinct from the rendered response captured on the flow).
      properties:
        id:
          type: string
        default:
          type: boolean
        source:
          type: string
        match:
          $ref: "#/components/schemas/StubMatch"
        matched_on:
          type: array
          items:
            type: string
          description: Which match criteria the stub constrained.
        response_template:
          $ref: "#/components/schemas/StubResponseTemplate"
      additionalProperties: false

    StubMatch:
      type: object
      properties:
        method:
          type: string
        path:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        query:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        body_contains:
          type: string
      additionalProperties: false

    StubResponseTemplate:
      type: object
      properties:
        status:
          type: integer
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        delay_ms:
          type: integer
        fault:
          type: string
      additionalProperties: false

    HttpRequest:
      type: object
      required:
        - method
        - url
      properties:
        method:
          type: string
        url:
          type: string
        headers:
          $ref: "#/components/schemas/Headers"
        body:
          $ref: "#/components/schemas/Body"
      additionalProperties: false

    HttpResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
        headers:
          $ref: "#/components/schemas/Headers"
        body:
          $ref: "#/components/schemas/Body"
      additionalProperties: false

    Headers:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

    Body:
      type: object
      properties:
        encoding:
          type: string
          enum: [utf8, base64, binary]
        text:
          type: string
        bytes:
          type: string
          description: Base64-encoded bytes when encoding=base64.
        content_encoding:
          type: string
          description: >-
            Original on-the-wire Content-Encoding (e.g. gzip) when the payload
            was decompressed before storage. Absent means it was not compressed.
        decoded:
          $ref: "#/components/schemas/DecodedBody"
      additionalProperties: false

    DecodedBody:
      type: object
      properties:
        encoding:
          type: string
          enum: [json, text]
        text:
          type: string
        schema_ref:
          type: string
      additionalProperties: false

    Assertion:
      type: object
      required:
        - id
        - channel
        - phase
        - operator
        - result
      properties:
        id:
          type: string
        channel:
          type: string
          enum: [test_to_sut, sut_to_mock]
        phase:
          type: string
          enum: [request, response]
        flow_id:
          type: string
        field:
          type: string
        path_lang:
          type: string
          enum: [jsonpath, header, status]
        operator:
          type: string
        expected:
          type: [string, number, boolean, object, array, "null"]
        actual:
          type: [string, number, boolean, object, array, "null"]
        result:
          type: string
          enum: [pass, fail, error, recorded]
        message:
          type: string
      additionalProperties: false

    SchemaValidation:
      type: object
      properties:
        status:
          type: string
          enum: [pass, fail, skipped]
          description: skipped when the test case attached no schemas.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/SchemaValidationError"
      additionalProperties: false

    SchemaValidationError:
      type: object
      properties:
        flow_id:
          type: string
        channel:
          type: string
        protocol:
          type: string
        phase:
          type: string
        schema_id:
          type: string
        message:
          type: string
      additionalProperties: false

    Redaction:
      type: object
      required:
        - field
        - rule
      properties:
        field:
          type: string
        rule:
          type: string
          enum: [mask, remove]
        replacement:
          type: string
      additionalProperties: false
