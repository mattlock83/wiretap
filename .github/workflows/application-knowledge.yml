name: Application knowledge bundles

on:
  pull_request:
    paths: ['.github/workflows/application-knowledge.yml', 'go.mod', 'go.sum', 'cmd/**', 'internal/**', 'sdk/go/**', 'docs/schemas.go', 'docs/spec/**', 'docs/bundle-evidence.schema.json']
  push:
    branches: [main]
    paths: ['.github/workflows/application-knowledge.yml', 'go.mod', 'go.sum', 'cmd/**', 'internal/**', 'sdk/go/**', 'docs/schemas.go', 'docs/spec/**', 'docs/bundle-evidence.schema.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./cmd/wiretap validate --bundle docs/spec/examples/minimal
      - run: go run ./cmd/wiretap validate --bundle docs/spec/examples/tested-api
      - run: go run ./cmd/wiretap validate --bundle docs/spec/examples/wiretap-http
