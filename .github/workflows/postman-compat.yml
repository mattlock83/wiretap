name: Postman export compatibility

on:
  pull_request:
    paths: ['.github/workflows/postman-compat.yml', 'go.mod', 'go.sum', 'internal/postman/**', 'internal/bundle/**', 'internal/artifact/**', 'internal/grpccontract/**', 'examples/grpc-streaming/fixture/**', 'tests/postman-compat/**']
  push:
    branches: [main]
    paths: ['.github/workflows/postman-compat.yml', 'go.mod', 'go.sum', 'internal/postman/**', 'internal/bundle/**', 'internal/artifact/**', 'internal/grpccontract/**', 'examples/grpc-streaming/fixture/**', 'tests/postman-compat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/postman-compat/package-lock.json
      - run: npm ci --prefix tests/postman-compat
      - run: npm test --prefix tests/postman-compat
