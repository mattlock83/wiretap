name: Runtime, SDK and local package tests

on:
  pull_request:
    paths: ['.github/workflows/tests.yml', 'go.mod', 'go.sum', 'cmd/**', 'internal/**', 'sdk/**', 'examples/**', 'docs/**', 'scripts/**', 'tests/**', 'Dockerfile', '.dockerignore', 'LICENSE']
  push:
    branches: [main]
    paths: ['.github/workflows/tests.yml', 'go.mod', 'go.sum', 'cmd/**', 'internal/**', 'sdk/**', 'examples/**', 'docs/**', 'scripts/**', 'tests/**', 'Dockerfile', '.dockerignore', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Go SDK adoption in an external test suite
        run: node scripts/go-sdk-smoke.mjs
      - name: Verify advanced Go gRPC examples
        if: runner.os == 'Linux'
        run: |
          ./examples/grpc-boundaries/run.sh
          ./examples/grpc-streaming/run.sh
      - if: runner.os == 'Linux'
        run: go test -race ./internal/proxy ./internal/app ./sdk/go
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  javascript-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - run: npm ci --prefix sdk/js
      - run: npm test --prefix sdk/js
      - run: npm audit --prefix sdk/js --audit-level=low
      - run: node scripts/package-smoke.mjs
      - run: node scripts/runner-smoke.mjs
      - name: Install Chromium for the real browser capture check
        if: runner.os == 'Linux' && matrix.node == '22'
        run: node sdk/js/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Build the browser example runtime
        if: runner.os == 'Linux' && matrix.node == '22'
        run: go build -mod=readonly -o dist/wiretap ./cmd/wiretap
      - name: Verify browser and parallel API capture
        if: runner.os == 'Linux' && matrix.node == '22'
        env:
          WIRETAP_BINARY: ${{ github.workspace }}/dist/wiretap
          WIRETAP_PLAYWRIGHT_BROWSER: chromium
          WIRETAP_PLAYWRIGHT_PARALLEL: '1'
        run: node sdk/js/node_modules/@playwright/test/cli.js test --config examples/playwright-runner/playwright.config.cjs
      - name: Verify the documented Mocha example
        if: runner.os == 'Linux' && matrix.node == '22'
        env:
          WIRETAP_BINARY: ${{ github.workspace }}/dist/wiretap
        run: node sdk/js/node_modules/mocha/bin/mocha.js --config examples/mocha-runner/.mocharc.cjs
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux' && matrix.node == '22'
        with:
          name: playwright-browser-evidence
          path: examples/playwright-runner/artifacts/
          retention-days: 7
  local-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: '1700000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go run ./scripts/release --version v0.1.0-local --platforms host --out dist/first
      - run: go run ./scripts/release --version v0.1.0-local --platforms host --out dist/second
      - name: Verify reproducible archive checksums
        run: node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(fs.readFileSync('dist/first/SHA256SUMS','utf8'),fs.readFileSync('dist/second/SHA256SUMS','utf8'))"
      - name: Build local container without publishing
        run: docker build --build-arg VERSION=v0.1.0-local --build-arg COMMIT=${{ github.sha }} --build-arg DIRTY=false -t wiretap:local .
      - run: docker run --rm wiretap:local version --json

  existing-jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare unchanged external Jest 29 tests and parse their Postman export
        run: node examples/existing-jest/run.mjs artifacts/existing-jest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-jest-evidence
          path: |
            artifacts/existing-jest/*.json
            artifacts/existing-jest/*.log
            artifacts/existing-jest/demo/artifacts/wiretap/
          retention-days: 7
