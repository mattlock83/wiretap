[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wiretap-sdk"
version = "0.1.0"
description = "Capture existing Python API tests with Wiretap"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
pytest = ["pytest>=7.4,<10"]
test = ["pytest>=7.4,<10", "pytest-xdist>=3.6,<4"]

[project.entry-points.pytest11]
wiretap = "wiretap.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/mattlock83/wiretap"
